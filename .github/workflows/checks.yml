name: Checks

# Builds the app and runs tests/run.sh on every PR (and on trunk after a merge), so a compile
# break or a failing check turns the PR red before it ships. Needs no secrets: `--ci` signs
# ad-hoc and never touches a keychain — the signed DMG stays release.yml's job.
#
# Branch protection keys on the job's name ("Build and check"); renaming it silently drops
# the required check, so change it only together with the protection rule.

on:
  pull_request:
  push:
    branches: [trunk]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  # Only superseded PR runs: on trunk every merged commit must keep its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Build and check
    # macos-15 for the same reason as release.yml: the screenshot freeze needs the macOS 15.2+
    # SDK to compile, while build.sh still pins the deployment target to macOS 14.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (ad-hoc, no DMG)
        run: ./build.sh --ci

      - name: Run checks
        run: ./tests/run.sh
